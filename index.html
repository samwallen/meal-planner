<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wallen Meals">
<title>Wallen Meal Planner</title>
<style>
:root {
  --bg: #f2f0eb;
  --card: #ffffff;
  --border: #e8e4de;
  --accent: #5a8a63;
  --accent2: #4a7a53;
  --al: #edf5ef;
  --text: #1a1a1a;
  --text2: #555;
  --muted: #999;
  --gf: #6aab8e;
  --gfb: #eaf5f0;
  --he: #c49a5a;
  --heb: #fdf4e7;
  --danger: #d4675e;
  --r: 16px;
  --r2: 12px;
  --sh: 0 2px 20px rgba(0,0,0,.07);
  --sh2: 0 8px 40px rgba(0,0,0,.12);
  --nav-h: 83px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100%;
  padding-bottom: calc(var(--nav-h) + var(--safe-bottom));
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.app-header {
  background: rgba(242,240,235,.92);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 0.5px solid rgba(0,0,0,.1);
  padding: calc(12px + var(--safe-top)) 18px 12px;
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
}
.app-header h1 {
  font-size: 20px; font-weight: 700; letter-spacing: -.5px;
  background: linear-gradient(135deg, #3a6e44, #6aab7a);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.app-header p { font-size: 11px; color: var(--muted); margin-top: 1px; }
.hbtn {
  background: var(--card); border: none; border-radius: 20px;
  padding: 7px 14px; font-size: 12px; font-weight: 600; color: var(--text2);
  box-shadow: 0 1px 6px rgba(0,0,0,.1); cursor: pointer;
  transition: transform .1s, box-shadow .1s;
}
.hbtn:active { transform: scale(.96); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: rgba(255,255,255,.88);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  border-top: 0.5px solid rgba(0,0,0,.1);
  display: flex; align-items: stretch;
  padding-bottom: var(--safe-bottom);
  height: var(--nav-h);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; border: none; background: transparent;
  padding: 8px 4px; transition: transform .15s;
}
.nav-item:active { transform: scale(.92); }
.nav-icon {
  width: 28px; height: 28px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: all .2s; background: transparent;
}
.nav-item.on .nav-icon { background: var(--al); transform: scale(1.08); }
.nav-label {
  font-size: 10px; font-weight: 500; color: var(--muted); transition: color .2s;
}
.nav-item.on .nav-label { color: var(--accent); font-weight: 700; }

/* ── PAGES ── */
.pg { display: none; padding: 14px 14px 4px; max-width: 900px; margin: 0 auto; }
.pg.on { display: block; }

/* ── WEEK NAV ── */
.wnav {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; gap: 10px;
}
.wnav-label { font-size: 14px; font-weight: 700; color: var(--text); flex: 1; text-align: center; }
.wnav-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--card); border: none;
  box-shadow: 0 1px 6px rgba(0,0,0,.09);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--text2); cursor: pointer;
  transition: transform .1s, box-shadow .1s;
}
.wnav-btn:active { transform: scale(.92); }

/* ── DAY CARDS ── */
.dc {
  background: var(--card); border-radius: var(--r);
  box-shadow: var(--sh); margin-bottom: 10px;
  overflow: hidden; transition: box-shadow .2s;
}
.dc.today { box-shadow: 0 4px 24px rgba(90,138,99,.18); }
.dh {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; cursor: pointer; user-select: none;
}
.dh-left { display: flex; align-items: center; gap: 10px; }
.day-dot {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--bg); display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.today .day-dot { background: var(--accent); }
.day-dot-day { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
.today .day-dot-day { color: rgba(255,255,255,.8); }
.day-dot-num { font-size: 17px; font-weight: 700; color: var(--text); line-height: 1; margin-top: 1px; }
.today .day-dot-num { color: #fff; }
.dh-info { }
.dh-name { font-size: 15px; font-weight: 700; color: var(--text); }
.dh-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.dh-right { display: flex; align-items: center; gap: 8px; }
.dchev { font-size: 12px; color: var(--muted); transition: transform .25s; }
.dc.col .dchev { transform: rotate(-90deg); }
.dbody { padding: 0 14px 14px; }
.dc.col .dbody { display: none; }

/* ── MEAL SECTIONS ── */
.msec { margin-bottom: 10px; }
.msec-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0 6px;
}
.msec-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .8px; color: var(--muted);
}
.msec-add {
  background: var(--al); border: none; border-radius: 20px;
  padding: 4px 10px; font-size: 11px; font-weight: 600;
  color: var(--accent); cursor: pointer; transition: background .15s;
}
.msec-add:active { background: #d8ecd9; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  border-radius: 20px; padding: 6px 10px;
  font-size: 12px; font-weight: 500;
  background: #f0ede8; border: 1px solid #e0ddd8;
  transition: transform .1s;
}
.chip:active { transform: scale(.96); }
.chip.gf { background: var(--gfb); border-color: #b8ddc9; }
.chip.he { background: var(--heb); border-color: #e8cb90; }
.chip-gf { font-size: 8px; background: var(--gf); color: #fff; border-radius: 8px; padding: 1px 4px; font-weight: 700; }
.chip-he { font-size: 8px; background: var(--he); color: #fff; border-radius: 8px; padding: 1px 4px; font-weight: 700; }
.chip-rm {
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 14px; line-height: 1;
  padding: 0 0 0 2px; display: flex; align-items: center;
}
.chip-rm:active { color: var(--danger); }
.empty-slot {
  font-size: 12px; color: #c0bbb4; font-style: italic;
  padding: 4px 0;
}
.msec-divider { height: 0.5px; background: var(--border); margin: 2px 0 8px; }

/* NOTES */
.day-notes {
  width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
  padding: 9px 12px; font-size: 13px; font-family: inherit;
  color: var(--text); background: var(--bg); resize: none; outline: none;
  margin-top: 6px; transition: border-color .2s;
}
.day-notes:focus { border-color: var(--accent); background: #fff; }

/* ── OVERLAYS / MODALS ── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.4); z-index: 300;
  align-items: flex-end; justify-content: center;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.overlay.on { display: flex; }
.modal {
  background: var(--card); width: 100%; max-width: 560px;
  border-radius: 24px 24px 0 0;
  max-height: 88vh; display: flex; flex-direction: column;
  animation: slideUp .32s cubic-bezier(.34,1.36,.64,1);
  padding-bottom: var(--safe-bottom);
}
@keyframes slideUp {
  from { transform: translateY(60px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-handle {
  width: 40px; height: 4px; background: #ddd; border-radius: 2px;
  margin: 12px auto 4px;
}
.modal-hd {
  padding: 10px 18px 12px; display: flex; align-items: center;
  justify-content: space-between; border-bottom: 0.5px solid var(--border);
}
.modal-hd h3 { font-size: 17px; font-weight: 700; }
.modal-close {
  width: 30px; height: 30px; background: #f0f0f0; border: none;
  border-radius: 50%; font-size: 14px; cursor: pointer; color: #666;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:active { background: #e0e0e0; }
.modal-search { padding: 10px 14px; border-bottom: 0.5px solid var(--border); }
.modal-search input {
  width: 100%; background: var(--bg); border: none; border-radius: 10px;
  padding: 9px 12px; font-size: 15px; font-family: inherit;
  color: var(--text); outline: none;
}
.modal-filters {
  padding: 8px 14px; display: flex; gap: 6px; overflow-x: auto;
  scrollbar-width: none; border-bottom: 0.5px solid var(--border);
}
.modal-filters::-webkit-scrollbar { display: none; }
.fchip {
  border: 1.5px solid var(--border); background: transparent;
  border-radius: 20px; padding: 4px 12px; font-size: 12px;
  font-weight: 600; cursor: pointer; color: var(--muted);
  white-space: nowrap; transition: all .15s;
}
.fchip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.fchip.gf.on { background: var(--gf); border-color: var(--gf); }
.fchip.he.on { background: var(--he); border-color: var(--he); }
.modal-list { overflow-y: auto; flex: 1; }
.list-cat {
  padding: 6px 16px 4px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
  background: var(--bg); position: sticky; top: 0; z-index: 1;
}
.ritem {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; cursor: pointer; transition: background .1s;
}
.ritem:active { background: var(--bg); }
.ritem.sel { background: var(--al); }
.rchk {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; transition: all .2s;
}
.ritem.sel .rchk { background: var(--accent); border-color: var(--accent); color: #fff; }
.rname { font-size: 14px; font-weight: 500; }
.rcat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
.rtags { display: flex; gap: 4px; margin-left: auto; flex-shrink: 0; }
.rtag { font-size: 8px; font-weight: 700; border-radius: 8px; padding: 2px 5px; }
.rtag-gf { background: var(--gf); color: #fff; }
.rtag-he { background: var(--he); color: #fff; }
.modal-footer {
  padding: 12px 16px; border-top: 0.5px solid var(--border);
  display: flex; gap: 8px; justify-content: flex-end;
}

/* ── BUTTONS ── */
.btn {
  border: none; cursor: pointer; border-radius: 12px; font-size: 14px;
  font-weight: 600; padding: 10px 20px; transition: all .15s;
  font-family: inherit;
}
.btn:active { transform: scale(.97); }
.btn-fill { background: var(--accent); color: #fff; }
.btn-fill:active { background: var(--accent2); }
.btn-ghost { background: var(--bg); color: var(--text2); }
.btn-ghost:active { background: var(--border); }
.btn-danger { background: #fde8e6; color: var(--danger); }

/* ── FORM ELEMENTS ── */
.form-group { margin-bottom: 14px; }
.form-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .6px; color: var(--muted); display: block; margin-bottom: 6px;
}
.form-input {
  width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
  padding: 10px 12px; font-size: 15px; font-family: inherit;
  color: var(--text); background: var(--bg); outline: none;
  transition: border-color .2s, background .2s;
}
.form-input:focus { border-color: var(--accent); background: #fff; }
.form-select {
  width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
  padding: 10px 12px; font-size: 15px; font-family: inherit;
  color: var(--text); background: var(--bg); outline: none;
}
.toggle-row { display: flex; gap: 8px; flex-wrap: wrap; }
.toggle-btn {
  border: 1.5px solid var(--border); background: transparent;
  border-radius: 20px; padding: 7px 14px; font-size: 13px;
  font-weight: 600; cursor: pointer; color: var(--muted);
  transition: all .2s; font-family: inherit;
}
.toggle-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.toggle-btn.gft.on { background: var(--gf); border-color: var(--gf); }
.toggle-btn.het.on { background: var(--he); border-color: var(--he); }
.ing-row { display: flex; gap: 6px; margin-bottom: 6px; }
.ing-row input {
  flex: 1; border: 1.5px solid var(--border); border-radius: 10px;
  padding: 9px 11px; font-size: 14px; font-family: inherit;
  outline: none; background: var(--bg); color: var(--text);
}
.ing-row input:focus { border-color: var(--accent); background: #fff; }
.ing-rm {
  background: none; border: none; cursor: pointer; color: var(--muted);
  font-size: 18px; padding: 0 4px; display: flex; align-items: center;
}
.ing-rm:active { color: var(--danger); }

/* ── GROCERY ── */
.grocery-section { margin-bottom: 18px; }
.grocery-hd {
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .7px; color: var(--muted);
  padding: 6px 0; margin-bottom: 4px;
  border-bottom: 0.5px solid var(--border);
}
.grocery-card { background: var(--card); border-radius: var(--r2); box-shadow: var(--sh); overflow: hidden; }
.gi {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-bottom: 0.5px solid var(--border);
  cursor: pointer; transition: background .1s;
}
.gi:last-child { border-bottom: none; }
.gi:active { background: var(--bg); }
.gi.done { opacity: .55; }
.gi-check {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; transition: all .2s; background: #fff;
}
.gi.done .gi-check { background: var(--gf); border-color: var(--gf); color: #fff; }
.gi-name { font-size: 14px; flex: 1; }
.gi.done .gi-name { text-decoration: line-through; }
.gi-src { font-size: 11px; color: var(--muted); }
.gempty {
  text-align: center; padding: 52px 24px;
  color: var(--muted); font-size: 14px; line-height: 1.8;
}
.gempty-icon { font-size: 44px; margin-bottom: 12px; }

/* ── RECIPE INDEX ── */
.index-search-row { display: flex; gap: 8px; margin-bottom: 12px; }
.index-search {
  flex: 1; background: var(--card); border: none; border-radius: 12px;
  padding: 10px 14px; font-size: 15px; font-family: inherit;
  color: var(--text); outline: none; box-shadow: var(--sh);
}
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.icard {
  background: var(--card); border-radius: var(--r); box-shadow: var(--sh);
  padding: 13px; cursor: pointer; transition: transform .15s, box-shadow .15s;
}
.icard:active { transform: scale(.97); box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.icard-name { font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 4px; }
.icard-cat { font-size: 11px; color: var(--muted); }
.icard-tags { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.icard-ings { font-size: 11px; color: var(--muted); margin-top: 7px; line-height: 1.5; }
.icard-btns { display: flex; gap: 5px; margin-top: 9px; }
.icard-btn {
  border: 1.5px solid var(--border); background: transparent;
  border-radius: 8px; padding: 4px 10px; font-size: 11px;
  font-weight: 600; cursor: pointer; color: var(--muted); font-family: inherit;
}
.icard-btn:active { border-color: var(--accent); color: var(--accent); }
.icard-btn.del:active { border-color: var(--danger); color: var(--danger); }
.filter-scroll {
  display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
  margin-bottom: 12px; scrollbar-width: none;
}
.filter-scroll::-webkit-scrollbar { display: none; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: calc(var(--nav-h) + var(--safe-bottom) + 12px);
  left: 50%; transform: translateX(-50%);
  background: rgba(30,30,30,.92); color: #fff;
  padding: 10px 20px; border-radius: 24px; font-size: 13px; font-weight: 600;
  z-index: 999; opacity: 0; transition: opacity .25s; pointer-events: none;
  white-space: nowrap; backdrop-filter: blur(8px);
}
.toast.on { opacity: 1; }

/* ── SECTION HEADER ── */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.section-title { font-size: 22px; font-weight: 800; letter-spacing: -.4px; }

/* ── iPad tweaks ── */
@media (min-width: 768px) {
  .app-header h1 { font-size: 24px; }
  .igrid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .pg { padding: 18px 18px 4px; }
  .modal { border-radius: 24px; margin-bottom: 20px; max-height: 80vh; }
  .overlay { align-items: center; }
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- HEADER -->
<header class="app-header">
  <div>
    <h1>Wallen Meal Planner</h1>
    <p id="hweek">Loading...</p>
  </div>
  <button class="hbtn" onclick="clearWeek()">Clear Week</button>
</header>

<!-- PAGES -->
<div class="pg on" id="pg-planner">
  <div class="wnav">
    <button class="wnav-btn" onclick="changeWeek(-1)">&#8249;</button>
    <span class="wnav-label" id="wlabel"></span>
    <button class="wnav-btn" onclick="changeWeek(1)">&#8250;</button>
  </div>
  <div id="days"></div>
</div>

<div class="pg" id="pg-grocery">
  <div class="section-header">
    <span class="section-title">Grocery List</span>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" style="padding:8px 14px;font-size:13px" onclick="uncheckAll()">Reset</button>
      <button class="btn btn-ghost" style="padding:8px 14px;font-size:13px" onclick="window.print()">Print</button>
    </div>
  </div>
  <div id="glist"></div>
</div>

<div class="pg" id="pg-index">
  <div class="section-header">
    <span class="section-title">Recipes</span>
    <button class="btn btn-fill" style="padding:9px 16px;font-size:13px" onclick="openRecipeForm()">+ Add</button>
  </div>
  <div class="filter-scroll" id="idx-filters">
    <button class="fchip on" data-if="all" onclick="setIF(this)">All</button>
    <button class="fchip gf" data-if="gf" onclick="setIF(this)">Gluten-Free</button>
    <button class="fchip he" data-if="he" onclick="setIF(this)">Home Essential</button>
    <button class="fchip" data-if="breakfast" onclick="setIF(this)">Breakfast</button>
    <button class="fchip" data-if="lunch" onclick="setIF(this)">Lunch</button>
    <button class="fchip" data-if="dinner" onclick="setIF(this)">Dinner</button>
    <button class="fchip" data-if="snack" onclick="setIF(this)">Snacks</button>
    <button class="fchip" data-if="custom" onclick="setIF(this)">My Recipes</button>
  </div>
  <div class="index-search-row">
    <input class="index-search" type="text" id="isearch" placeholder="Search recipes or ingredients..." oninput="renderIndex()">
  </div>
  <div class="igrid" id="igrid"></div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item on" id="nav-planner" onclick="showPage('planner')">
    <div class="nav-icon">&#128197;</div>
    <span class="nav-label">Planner</span>
  </button>
  <button class="nav-item" id="nav-grocery" onclick="showPage('grocery')">
    <div class="nav-icon">&#128722;</div>
    <span class="nav-label">Grocery</span>
  </button>
  <button class="nav-item" id="nav-index" onclick="showPage('index')">
    <div class="nav-icon">&#128214;</div>
    <span class="nav-label">Recipes</span>
  </button>
</nav>

<!-- PICKER MODAL -->
<div class="overlay" id="ov-picker" onclick="if(event.target===this)closePicker()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-hd">
      <h3 id="picker-title">Add Recipe</h3>
      <button class="modal-close" onclick="closePicker()">&#10005;</button>
    </div>
    <div class="modal-search">
      <input type="text" id="picker-q" placeholder="Search recipes or ingredients..." oninput="renderPicker()">
    </div>
    <div class="modal-filters">
      <button class="fchip on" data-mf="all" onclick="setPF(this)">All</button>
      <button class="fchip gf" data-mf="gf" onclick="setPF(this)">Gluten-Free</button>
      <button class="fchip he" data-mf="he" onclick="setPF(this)">Home Essential</button>

const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const MEALS=[{k:"breakfast",l:"Breakfast"},{k:"lunch",l:"Lunch"},{k:"dinner",l:"Dinner"},{k:"snack",l:"Snacks"}];
const CLABELS={breakfast:"Breakfast",lunch:"Lunch",dinner:"Dinner",snack:"Snacks",essential:"Home Essentials"};
const GCATS={
produce:["avocado","tomato","cucumber","carrot","celery","onion","garlic","lemon","lime","pepper","zucchini","spinach","lettuce","broccoli","asparagus","banana","apple","mango","berry","berries","pineapple","corn","ginger","parsley","cilantro","basil","thyme","rosemary","dill","jalap","squash","snap pea","edamame","cabbage","herb"],
proteins:["chicken","turkey","salmon","shrimp","tuna","beef","egg","bacon","cottage","mozzarella","feta","parmesan","cheddar"],
dairy:["yogurt","butter","milk","cream","cheese"],
nuts:["almond","cashew","walnut","pecan","pine nut","nut","seed","chia","coconut"],
pantry:["oil","broth","tamari","aminos","vinegar","sauce","salsa","pesto","marinara","mustard","hummus","oats","quinoa","pasta","rice","beans","chickpea","breadcrumb","flour","baking","honey","maple","vanilla","can","jar"],
snacks:["granola","rice cake","chocolate","dried","raisin","cranberry"],
spices:["salt","pepper","cumin","paprika","oregano","seasoning","spice","turmeric","cinnamon","powder","flake","capers","bagel"]
};

// ── STATE ──
function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem('wmp1')||'{}');
    recipes=[...DR,...(s.cr||[])];
    weekData=s.wd||{};gChecked=s.gc||{};nextId=s.ni||2000;
  }catch(e){ recipes=[...DR];weekData={};gChecked={};nextId=2000; }
}
function saveState(){
  try{
    localStorage.setItem('wmp1',JSON.stringify({cr:recipes.filter(r=>r.custom),wd:weekData,gc:gChecked,ni:nextId}));
  }catch(e){}
}
let recipes,weekData,gChecked,nextId;
let weekOffset=0,collapsed={};
let pCtx=null,pFilter='all',pTemp=[];
let iF='all',editId=null;
loadState();

// ── UTILS ──
function getR(id){return recipes.find(r=>r.id===id);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m,d=2000){
  const t=document.getElementById('toast');
  t.textContent=m;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),d);
}
function getWeekDates(o){
  const today=new Date(2026,5,10);
  const day=today.getDay();
  const mon=new Date(today);
  mon.setDate(today.getDate()-(day===0?6:day-1)+o*7);
  return DAYS.map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
function fmt(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtDay(d){return d.toLocaleDateString('en-US',{weekday:'short'});}
function dk(d){return d.toISOString().slice(0,10);}
function ensureDay(k){
  if(!weekData[k])weekData[k]={breakfast:[],lunch:[],dinner:[],snack:[],notes:''};
  MEALS.forEach(m=>{if(!weekData[k][m.k])weekData[k][m.k]=[];});
}
function guessGCat(ing){
  const s=ing.toLowerCase();
  for(const[cat,kws]of Object.entries(GCATS)){if(kws.some(k=>s.includes(k)))return cat;}
  return 'other';
}

// ── PAGES ──
function showPage(name){
  ['planner','grocery','index'].forEach(p=>{
    document.getElementById('pg-'+p).classList.toggle('on',p===name);
    document.getElementById('nav-'+p).classList.toggle('on',p===name);
  });
  if(name==='grocery')renderGrocery();
  if(name==='index')renderIndex();
}

// ── PLANNER ──
function changeWeek(d){weekOffset+=d;renderPlanner();}
function clearWeek(){
  if(!confirm('Clear all meals for this week?'))return;
  getWeekDates(weekOffset).forEach(d=>{weekData[dk(d)]={breakfast:[],lunch:[],dinner:[],snack:[],notes:''};});
  saveState();renderPlanner();
}
function renderPlanner(){
  const dates=getWeekDates(weekOffset);
  document.getElementById('wlabel').textContent=fmt(dates[0])+' \u2013 '+fmt(dates[6]);
  document.getElementById('hweek').textContent='Week of '+fmt(dates[0]);
  const grid=document.getElementById('days');
  grid.innerHTML='';
  const todayKey=dk(new Date(2026,5,10));
  dates.forEach((date,i)=>{
    const key=dk(date);
    ensureDay(key);
    const data=weekData[key];
    const isCol=!!collapsed[key];
    const isToday=key===todayKey;
    const total=MEALS.reduce((s,m)=>s+(data[m.k]||[]).length,0);
    const card=document.createElement('div');
    card.className='dc'+(isToday?' today':'')+(isCol?' col':'');
    card.id='dc-'+key;
    const dayNum=date.getDate();
    const dayShort=fmtDay(date).toUpperCase();
    card.innerHTML=
      '<div class="dh" onclick="toggleDay(\''+key+'\')">'+
        '<div class="dh-left">'+
          '<div class="day-dot">'+
            '<span class="day-dot-day">'+dayShort+'</span>'+
            '<span class="day-dot-num">'+dayNum+'</span>'+
          '</div>'+
          '<div class="dh-info">'+
            '<div class="dh-name">'+DAYS[i]+(isToday?' &bull; Today':'')+'</div>'+
            '<div class="dh-sub">'+(total?total+' meal'+(total>1?'s':''):'Nothing planned yet')+'</div>'+
          '</div>'+
        '</div>'+
        '<div class="dh-right">'+
          '<span class="dchev">&#8964;</span>'+
        '</div>'+
      '</div>'+
      '<div class="dbody">'+
        '<div id="ms-'+key+'">'+buildMealSections(key)+'</div>'+
        '<textarea class="day-notes" rows="2" placeholder="Notes for '+DAYS[i]+'..." onchange="saveNote(\''+key+'\',this.value)">'+esc(data.notes||'')+'</textarea>'+
      '</div>';
    grid.appendChild(card);
  });
}
function buildMealSections(key){
  return MEALS.map((m,mi)=>{
    const entries=weekData[key][m.k]||[];
    const chips=entries.map(e=>{
      const r=getR(e.id);if(!r)return'';
      const cls='chip'+(r.gf?' gf':'')+(r.he?' he':'');
      return '<div class="'+cls+'">'+
        (r.gf?'<span class="chip-gf">GF</span>':'')+
        (r.he?'<span class="chip-he">HE</span>':'')+
        '<span>'+esc(r.name)+'</span>'+
        '<button class="chip-rm" onclick="removeR(\''+key+'\',\''+m.k+'\','+e.id+')" aria-label="Remove">&times;</button>'+
      '</div>';
    }).join('');
    const divider=mi<MEALS.length-1?'<div class="msec-divider"></div>':'';
    return '<div class="msec">'+
      '<div class="msec-hd">'+
        '<span class="msec-label">'+m.l+'</span>'+
        '<button class="msec-add" onclick="openPicker(\''+key+'\',\''+m.k+'\',\''+m.l+'\')">+ Add</button>'+
      '</div>'+
      '<div class="chips">'+(entries.length?chips:'<span class="empty-slot">Nothing added</span>')+'</div>'+
    '</div>'+divider;
  }).join('');
}
function toggleDay(k){
  collapsed[k]=!collapsed[k];
  const c=document.getElementById('dc-'+k);
  if(c)c.classList.toggle('col',!!collapsed[k]);
}
function saveNote(k,v){ensureDay(k);weekData[k].notes=v;saveState();}
function removeR(dk,mk,id){
  ensureDay(dk);
  weekData[dk][mk]=(weekData[dk][mk]||[]).filter(e=>e.id!==id);
  saveState();
  const el=document.getElementById('ms-'+dk);
  if(el)el.innerHTML=buildMealSections(dk);
}

// ── PICKER ──
function openPicker(dayK,mealK,mealL){
  pCtx={dk:dayK,mk:mealK};
  ensureDay(dayK);
  pTemp=(weekData[dayK][mealK]||[]).map(e=>({...e}));
  pFilter='all';
  document.getElementById('picker-title').textContent='Add to '+mealL;
  document.getElementById('picker-q').value='';
  document.querySelectorAll('[data-mf]').forEach(b=>b.classList.toggle('on',b.dataset.mf==='all'));
  renderPicker();
  document.getElementById('ov-picker').classList.add('on');
}
function closePicker(){document.getElementById('ov-picker').classList.remove('on');pCtx=null;}
function confirmPicker(){
  if(!pCtx)return;
  ensureDay(pCtx.dk);
  weekData[pCtx.dk][pCtx.mk]=pTemp;
  closePicker();saveState();
  const el=document.getElementById('ms-'+pCtx.dk);
  renderPlanner();
}
function setPF(btn){
  pFilter=btn.dataset.mf;
  document.querySelectorAll('[data-mf]').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');renderPicker();
}
function renderPicker(){
  const q=(document.getElementById('picker-q').value||'').toLowerCase();
  const list=recipes.filter(r=>{
    if(pFilter==='gf'&&!r.gf)return false;
    if(pFilter==='he'&&!r.he)return false;
    if(['breakfast','lunch','dinner','snack'].includes(pFilter)&&r.cat!==pFilter)return false;
    if(q&&!r.name.toLowerCase().includes(q)&&!r.ing.some(i=>i.toLowerCase().includes(q)))return false;
    return true;
  });
  const order=['breakfast','lunch','dinner','snack','essential'];
  const grouped={};
  list.forEach(r=>{if(!grouped[r.cat])grouped[r.cat]=[];grouped[r.cat].push(r);});
  let html='';
  order.forEach(cat=>{
    if(!grouped[cat])return;
    html+='<div class="list-cat">'+CLABELS[cat]+'</div>';
    grouped[cat].forEach(r=>{
      const sel=!!pTemp.find(e=>e.id===r.id);
      html+='<div class="ritem'+(sel?' sel':'')+'" onclick="togglePicker('+r.id+')">'+
        '<div class="rchk">'+(sel?'&#10003;':'')+'</div>'+
        '<div style="flex:1">'+
          '<div class="rname">'+esc(r.name)+'</div>'+
          '<div class="rcat-label">'+CLABELS[r.cat]+'</div>'+
        '</div>'+
        '<div class="rtags">'+
          (r.gf?'<span class="rtag rtag-gf">GF</span>':'')+
          (r.he?'<span class="rtag rtag-he">HE</span>':'')+
          (r.custom?'<span class="rtag" style="background:#e8e0ff;color:#6050b0">Mine</span>':'')+
        '</div>'+
      '</div>';
    });
  });
  if(!html)html='<div style="text-align:center;padding:32px;color:var(--muted);font-size:15px">No recipes found</div>';
  document.getElementById('picker-list').innerHTML=html;
}
function togglePicker(id){
  const i=pTemp.findIndex(e=>e.id===id);
  if(i>=0)pTemp.splice(i,1);
  else pTemp.push({id});
  renderPicker();
}

// ── RECIPE FORM ──
function openRecipeForm(id){
  editId=id||null;
  const r=id?getR(id):null;
  document.getElementById('rf-title').textContent=r?'Edit Recipe':'New Recipe';
  document.getElementById('rf-name').value=r?r.name:'';
  document.getElementById('rf-cat').value=r?r.cat:'dinner';
  document.getElementById('rf-gf').classList.toggle('on',r?r.gf:true);
  document.getElementById('rf-he').classList.toggle('on',r?!!r.he:false);
  document.getElementById('rf-notes').value=r?(r.notes||''):'';
  const list=document.getElementById('ing-list');
  list.innerHTML='';
  (r?r.ing:['','']).forEach(v=>addIngRow(v));
  document.getElementById('ov-recipe').classList.add('on');
}
function closeRecipeForm(){document.getElementById('ov-recipe').classList.remove('on');}
function addIngRow(val){
  const list=document.getElementById('ing-list');
  const row=document.createElement('div');
  row.className='ing-row';
  row.innerHTML='<input type="text" placeholder="e.g. Chicken breast (1 lb)" value="'+esc(val||'')+'">'+
    '<button class="ing-rm" onclick="this.parentElement.remove()">&times;</button>';
  list.appendChild(row);
}
function saveRecipe(){
  const name=document.getElementById('rf-name').value.trim();
  if(!name){toast('Please enter a recipe name');return;}
  const ing=Array.from(document.querySelectorAll('#ing-list .ing-row input'))
    .map(i=>i.value.trim()).filter(Boolean);
  const r={
    id:editId||(nextId++),
    name,
    cat:document.getElementById('rf-cat').value,
    gf:document.getElementById('rf-gf').classList.contains('on'),
    he:document.getElementById('rf-he').classList.contains('on'),
    custom:true,
    notes:document.getElementById('rf-notes').value.trim(),
    ing:ing.length?ing:['(no ingredients listed)']
  };
  if(editId){
    const idx=recipes.findIndex(x=>x.id===editId);
    if(idx>=0)recipes[idx]=r;
  } else {
    recipes.push(r);
  }
  saveState();closeRecipeForm();renderIndex();
  toast(editId?'Recipe updated':'Recipe saved');
}
function deleteRecipe(id){
  if(!confirm('Delete this recipe?'))return;
  recipes=recipes.filter(r=>r.id!==id);
  Object.keys(weekData).forEach(k=>{
    MEALS.forEach(m=>{weekData[k][m.k]=(weekData[k][m.k]||[]).filter(e=>e.id!==id);});
  });
  saveState();renderIndex();toast('Recipe deleted');
}

// ── GROCERY ──
function renderGrocery(){
  const dates=getWeekDates(weekOffset);
  const all=[];
  dates.forEach(d=>{
    const key=dk(d);ensureDay(key);
    MEALS.forEach(m=>{
      (weekData[key][m.k]||[]).forEach(e=>{
        const r=getR(e.id);if(!r)return;
        r.ing.forEach(ing=>all.push({ing,recipe:r.name,gf:r.gf}));
      });
    });
  });
  const el=document.getElementById('glist');
  if(!all.length){
    el.innerHTML='<div class="gempty"><div class="gempty-icon">&#128722;</div>No meals planned yet.<br>Add recipes in the Planner and your list will appear here automatically.</div>';
    return;
  }
  const byCat={};
  all.forEach(item=>{
    const cat=guessGCat(item.ing);
    if(!byCat[cat])byCat[cat]=[];
    byCat[cat].push(item);
  });
  const catOrder=['produce','proteins','dairy','nuts','pantry','snacks','spices','other'];
  const catNames={
    produce:'Produce',proteins:'Proteins & Meat',dairy:'Dairy & Alternatives',
    nuts:'Nuts & Seeds',pantry:'Pantry & Staples',
    snacks:'Snacks',spices:'Spices & Seasonings',other:'Other'
  };
  let html='';
  catOrder.forEach(cat=>{
    if(!byCat[cat]||!byCat[cat].length)return;
    html+='<div class="grocery-section"><div class="grocery-hd">'+catNames[cat]+'</div><div class="grocery-card">';
    byCat[cat].forEach((item,idx)=>{
      const gkey=cat+'_'+idx;
      const checked=!!gChecked[gkey];
      html+='<div class="gi'+(checked?' done':'')+'" id="gi-'+gkey+'" onclick="toggleGC(\''+gkey+'\')">'+
        '<div class="gi-check">'+(checked?'&#10003;':'')+'</div>'+
        '<div style="flex:1">'+
          '<div class="gi-name">'+esc(item.ing)+(item.gf?' <span style="font-size:9px;background:var(--gf);color:#fff;border-radius:6px;padding:1px 5px;font-weight:700">GF</span>':'')+'</div>'+
          '<div class="gi-src">'+esc(item.recipe)+'</div>'+
        '</div>'+
      '</div>';
    });
    html+='</div></div>';
  });
  el.innerHTML=html;
}
function toggleGC(key){
  gChecked[key]=!gChecked[key];
  const row=document.getElementById('gi-'+key);
  if(row){
    row.classList.toggle('done',!!gChecked[key]);
    const chk=row.querySelector('.gi-check');
    if(chk)chk.innerHTML=gChecked[key]?'&#10003;':'';
  }
  saveState();
}
function uncheckAll(){gChecked={};saveState();renderGrocery();}

// ── RECIPE INDEX ──
function setIF(btn){
  iF=btn.dataset.if;
  document.querySelectorAll('[data-if]').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');renderIndex();
}
function renderIndex(){
  const q=(document.getElementById('isearch').value||'').toLowerCase();
  const list=recipes.filter(r=>{
    if(iF==='gf'&&!r.gf)return false;
    if(iF==='he'&&!r.he)return false;
    if(iF==='custom'&&!r.custom)return false;
    if(['breakfast','lunch','dinner','snack'].includes(iF)&&r.cat!==iF)return false;
    if(q&&!r.name.toLowerCase().includes(q)&&!r.ing.some(i=>i.toLowerCase().includes(q)))return false;
    return true;
  });
  const grid=document.getElementById('igrid');
  if(!list.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:44px;color:var(--muted);font-size:15px">No recipes match.</div>';
    return;
  }
  grid.innerHTML=list.map(r=>
    '<div class="icard">'+
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:4px">'+
        '<div class="icard-name">'+esc(r.name)+'</div>'+
        '<div class="icard-tags">'+
          (r.gf?'<span class="rtag rtag-gf">GF</span>':'')+
          (r.he?'<span class="rtag rtag-he">HE</span>':'')+
          (r.custom?'<span class="rtag" style="background:#e8e0ff;color:#6050b0">Mine</span>':'')+
        '</div>'+
      '</div>'+
      '<div class="icard-cat">'+CLABELS[r.cat]+'</div>'+
      '<div class="icard-ings">'+esc(r.ing.slice(0,4).join(', '))+(r.ing.length>4?'...':'')+'</div>'+
      '<div class="icard-btns">'+
        '<button class="icard-btn" onclick="openRecipeForm('+r.id+')">Edit</button>'+
        (r.custom?'<button class="icard-btn del" onclick="deleteRecipe('+r.id+')">Delete</button>':'')+
      '</div>'+
    '</div>'
  ).join('');
}

// ── INIT ──
renderPlanner();
</script>
