<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wallen Meals">
<title>Wallen Meal Planner</title>
<style>
:root{--bg:#f2f0eb;--card:#fff;--border:#e8e4de;--acc:#5a8a63;--acc2:#4a7a53;--al:#edf5ef;--tx:#1a1a1a;--tx2:#555;--mu:#999;--gf:#6aab8e;--gfb:#eaf5f0;--he:#c49a5a;--heb:#fdf4e7;--danger:#d4675e;--r:16px;--sh:0 2px 20px rgba(0,0,0,.07);--nh:83px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--tx);min-height:100%;padding-bottom:calc(var(--nh) + var(--sb));-webkit-font-smoothing:antialiased}
.app-hd{background:rgba(242,240,235,.93);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid rgba(0,0,0,.1);padding:calc(12px + var(--st)) 16px 12px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.app-hd h1{font-size:19px;font-weight:700;letter-spacing:-.4px;background:linear-gradient(135deg,#3a6e44,#6aab7a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.app-hd p{font-size:11px;color:var(--mu);margin-top:1px}
.hd-right{display:flex;align-items:center;gap:8px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#ccc;transition:background .3s}
.sync-dot.synced{background:#4ade80}
.sync-dot.syncing{background:#facc15;animation:pulse 1s infinite}
.sync-dot.offline{background:#f87171}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hbtn{background:var(--card);border:none;border-radius:20px;padding:7px 13px;font-size:12px;font-weight:600;color:var(--tx2);box-shadow:0 1px 6px rgba(0,0,0,.1);cursor:pointer}
.hbtn:active{transform:scale(.96)}
.bot-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-top:.5px solid rgba(0,0,0,.1);display:flex;padding-bottom:var(--sb);height:var(--nh)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:transparent;padding:8px 4px;transition:transform .15s}
.nav-item:active{transform:scale(.9)}
.nav-ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.nav-item.on .nav-ico{background:var(--al);transform:scale(1.08)}
.nav-lbl{font-size:10px;font-weight:500;color:var(--mu);transition:color .2s}
.nav-item.on .nav-lbl{color:var(--acc);font-weight:700}
.pg{display:none;padding:14px 14px 4px;max-width:900px;margin:0 auto}.pg.on{display:block}
.wnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.wnav-lbl{font-size:14px;font-weight:700;flex:1;text-align:center}
.wnav-btn{width:36px;height:36px;border-radius:50%;background:var(--card);border:none;box-shadow:0 1px 6px rgba(0,0,0,.09);font-size:17px;color:var(--tx2);cursor:pointer;transition:transform .1s}
.wnav-btn:active{transform:scale(.9)}
.dc{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.dc.today{box-shadow:0 4px 24px rgba(90,138,99,.2)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;user-select:none}
.dh:active{background:#f8f7f5}
.dh-l{display:flex;align-items:center;gap:10px}
.day-dot{width:38px;height:38px;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.today .day-dot{background:var(--acc)}
.dd-day{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mu)}
.today .dd-day{color:rgba(255,255,255,.8)}
.dd-num{font-size:17px;font-weight:700;color:var(--tx);line-height:1;margin-top:1px}
.today .dd-num{color:#fff}
.dh-name{font-size:15px;font-weight:700}
.dh-sub{font-size:11px;color:var(--mu);margin-top:1px}
.dchev{font-size:12px;color:var(--mu);transition:transform .25s}
.dc.col .dchev{transform:rotate(-90deg)}
.dbody{padding:0 14px 14px}.dc.col .dbody{display:none}
.msec{margin-bottom:10px}
.msec-hd{display:flex;align-items:center;justify-content:space-between;padding:8px 0 6px}
.msec-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--mu)}
.msec-add{background:var(--al);border:none;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--acc);cursor:pointer}
.msec-add:active{background:#d0e8d4}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:6px 10px;font-size:12px;font-weight:500;background:#f0ede8;border:1px solid #e0ddd8}
.chip.gf{background:var(--gfb);border-color:#b8ddc9}
.chip.he{background:var(--heb);border-color:#e8cb90}
.chip-gf{font-size:8px;background:var(--gf);color:#fff;border-radius:8px;padding:1px 4px;font-weight:700}
.chip-he{font-size:8px;background:var(--he);color:#fff;border-radius:8px;padding:1px 4px;font-weight:700}
.chip-rm{background:none;border:none;cursor:pointer;color:var(--mu);font-size:15px;padding:0 0 0 2px;line-height:1}
.chip-rm:active{color:var(--danger)}
.empty-slot{font-size:12px;color:#c0bbb4;font-style:italic;padding:4px 0}
.msec-div{height:.5px;background:var(--border);margin:2px 0 8px}
.day-notes{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit;color:var(--tx);background:var(--bg);resize:none;outline:none;margin-top:6px}
.day-notes:focus{border-color:var(--acc);background:#fff}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.overlay.on{display:flex}
.modal{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;max-height:88vh;display:flex;flex-direction:column;animation:slideUp .3s cubic-bezier(.34,1.36,.64,1);padding-bottom:var(--sb)}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.m-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:12px auto 4px}
.m-hd{padding:10px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--border)}
.m-hd h3{font-size:17px;font-weight:700}
.m-close{width:30px;height:30px;background:#f0f0f0;border:none;border-radius:50%;font-size:14px;cursor:pointer;color:#666;display:flex;align-items:center;justify-content:center}
.m-search{padding:10px 14px;border-bottom:.5px solid var(--border)}
.m-search input{width:100%;background:var(--bg);border:none;border-radius:10px;padding:9px 12px;font-size:15px;font-family:inherit;color:var(--tx);outline:none}
.m-filters{padding:8px 14px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:.5px solid var(--border)}
.m-filters::-webkit-scrollbar{display:none}
.fchip{border:1.5px solid var(--border);background:transparent;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--mu);white-space:nowrap;font-family:inherit}
.fchip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.fchip.gf.on{background:var(--gf);border-color:var(--gf)}
.fchip.he.on{background:var(--he);border-color:var(--he)}
.m-list{overflow-y:auto;flex:1}
.list-cat{padding:6px 16px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);background:var(--bg);position:sticky;top:0}
.ritem{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.ritem:active{background:var(--bg)}
.ritem.sel{background:var(--al)}
.rchk{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .2s}
.ritem.sel .rchk{background:var(--acc);border-color:var(--acc);color:#fff}
.rname{font-size:14px;font-weight:500}
.rcat-lbl{font-size:11px;color:var(--mu);margin-top:2px}
.rtags{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
.rtag{font-size:8px;font-weight:700;border-radius:8px;padding:2px 5px}
.rtag-gf{background:var(--gf);color:#fff}
.rtag-he{background:var(--he);color:#fff}
.rtag-c{background:#e8e0ff;color:#6050b0}
.m-foot{padding:12px 16px;border-top:.5px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.btn{border:none;cursor:pointer;border-radius:12px;font-size:14px;font-weight:600;padding:10px 20px;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-fill{background:var(--acc);color:#fff}
.btn-fill:active{background:var(--acc2)}
.btn-ghost{background:var(--bg);color:var(--tx2)}
.btn-ghost:active{background:var(--border)}
.fg{margin-bottom:14px}
.flbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);display:block;margin-bottom:6px}
.finp{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;color:var(--tx);background:var(--bg);outline:none}
.finp:focus{border-color:var(--acc);background:#fff}
.fsel{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;color:var(--tx);background:var(--bg);outline:none}
.ftrow{display:flex;gap:8px;flex-wrap:wrap}
.ftog{border:1.5px solid var(--border);background:transparent;border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--mu);font-family:inherit}
.ftog.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ftog.gft.on{background:var(--gf);border-color:var(--gf)}
.ftog.het.on{background:var(--he);border-color:var(--he)}
.ing-row{display:flex;gap:6px;margin-bottom:6px}
.ing-row input{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;outline:none;background:var(--bg);color:var(--tx)}
.ing-row input:focus{border-color:var(--acc);background:#fff}
.ing-rm{background:none;border:none;cursor:pointer;color:var(--mu);font-size:18px;display:flex;align-items:center;padding:0 4px}
.ing-rm:active{color:var(--danger)}
.gsec{margin-bottom:18px}
.gsec-hd{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mu);padding:6px 0;margin-bottom:4px;border-bottom:.5px solid var(--border)}
.g-card{background:var(--card);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.gi{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:.5px solid var(--border);cursor:pointer}
.gi:last-child{border-bottom:none}
.gi:active{background:var(--bg)}
.gi.done{opacity:.5}
.gi-chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;background:#fff;transition:all .2s}
.gi.done .gi-chk{background:var(--gf);border-color:var(--gf);color:#fff}
.gi-name{font-size:14px;flex:1}
.gi.done .gi-name{text-decoration:line-through}
.gi-src{font-size:11px;color:var(--mu)}
.gempty{text-align:center;padding:52px 24px;color:var(--mu);font-size:14px;line-height:1.8}
.gempty-ico{font-size:44px;margin-bottom:12px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{font-size:22px;font-weight:800;letter-spacing:-.4px}
.fscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.fscroll::-webkit-scrollbar{display:none}
.isrch{flex:1;background:var(--card);border:none;border-radius:12px;padding:10px 14px;font-size:15px;font-family:inherit;color:var(--tx);outline:none;box-shadow:var(--sh);width:100%;margin-bottom:12px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.icard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:13px;cursor:pointer;transition:transform .15s}
.icard:active{transform:scale(.97)}
.icard-name{font-size:13px;font-weight:600;line-height:1.4;margin-bottom:4px}
.icard-cat{font-size:11px;color:var(--mu)}
.icard-ings{font-size:11px;color:var(--mu);margin-top:7px;line-height:1.5}
.icard-tags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.icard-btns{display:flex;gap:5px;margin-top:9px}
.icard-btn{border:1.5px solid var(--border);background:transparent;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;color:var(--mu);font-family:inherit}
.icard-btn:active{border-color:var(--acc);color:var(--acc)}
.icard-btn.del:active{border-color:var(--danger);color:var(--danger)}
.toast{position:fixed;bottom:calc(var(--nh) + var(--sb) + 12px);left:50%;transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(8px)}
.toast.on{opacity:1}
@media(min-width:768px){.igrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.modal{border-radius:24px;margin-bottom:20px;max-height:80vh}.overlay{align-items:center}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<header class="app-hd">
  <div><h1>Wallen Meal Planner</h1><p id="hweek">Loading...</p></div>
  <div class="hd-right">
    <div class="sync-dot syncing" id="sync-dot" title="Connecting..."></div>
    <button class="hbtn" onclick="clearWeek()">Clear Week</button>
  </div>
</header>
<div class="pg on" id="pg-planner">
  <div class="wnav">
    <button class="wnav-btn" onclick="changeWeek(-1)">&#8249;</button>
    <span class="wnav-lbl" id="wlabel"></span>
    <button class="wnav-btn" onclick="changeWeek(1)">&#8250;</button>
  </div>
  <div id="days"></div>
</div>
<div class="pg" id="pg-grocery">
  <div class="sec-hd">
    <span class="sec-title">Grocery List</span>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" style="padding:8px 13px;font-size:13px" onclick="uncheckAll()">Reset</button>
      <button class="btn btn-ghost" style="padding:8px 13px;font-size:13px" onclick="window.print()">Print</button>
    </div>
  </div>
  <div id="glist"></div>
</div>
<div class="pg" id="pg-index">
  <div class="sec-hd">
    <span class="sec-title">Recipes</span>
    <button class="btn btn-fill" style="padding:9px 16px;font-size:13px" onclick="openRecipeForm()">+ Add</button>
  </div>
  <div class="fscroll">
    <button class="fchip on" data-if="all" onclick="setIF(this)">All</button>
    <button class="fchip gf" data-if="gf" onclick="setIF(this)">Gluten-Free</button>
    <button class="fchip he" data-if="he" onclick="setIF(this)">Home Essential</button>
    <button class="fchip" data-if="breakfast" onclick="setIF(this)">Breakfast</button>
    <button class="fchip" data-if="lunch" onclick="setIF(this)">Lunch</button>
    <button class="fchip" data-if="dinner" onclick="setIF(this)">Dinner</button>
    <button class="fchip" data-if="snack" onclick="setIF(this)">Snacks</button>
    <button class="fchip" data-if="custom" onclick="setIF(this)">My Recipes</button>
  </div>
  <input class="isrch" type="text" id="isearch" placeholder="Search recipes or ingredients..." oninput="renderIndex()">
  <div class="igrid" id="igrid"></div>
</div>
<nav class="bot-nav">
  <button class="nav-item on" id="nav-planner" onclick="showPage('planner')">
    <div class="nav-ico">&#128197;</div><span class="nav-lbl">Planner</span>
  </button>
  <button class="nav-item" id="nav-grocery" onclick="showPage('grocery')">
    <div class="nav-ico">&#128722;</div><span class="nav-lbl">Grocery</span>
  </button>
  <button class="nav-item" id="nav-index" onclick="showPage('index')">
    <div class="nav-ico">&#128214;</div><span class="nav-lbl">Recipes</span>
  </button>
</nav>
<div class="overlay" id="ov-picker" onclick="if(event.target===this)closePicker()">
  <div class="modal">
    <div class="m-handle"></div>
    <div class="m-hd"><h3 id="picker-title">Add Recipe</h3><button class="m-close" onclick="closePicker()">&#10005;</button></div>
    <div class="m-search"><input type="text" id="picker-q" placeholder="Search..." oninput="renderPicker()"></div>
    <div class="m-filters">
      <button class="fchip on" data-mf="all" onclick="setPF(this)">All</button>
      <button class="fchip gf" data-mf="gf" onclick="setPF(this)">Gluten-Free</button>
      <button class="fchip he" data-mf="he" onclick="setPF(this)">Home Essential</button>
      <button class="fchip" data-mf="breakfast" onclick="setPF(this)">Breakfast</button>
      <button class="fchip" data-mf="lunch" onclick="setPF(this)">Lunch</button>
      <button class="fchip" data-mf="dinner" onclick="setPF(this)">Dinner</button>
      <button class="fchip" data-mf="snack" onclick="setPF(this)">Snacks</button>
    </div>
    <div class="m-list" id="picker-list"></div>
    <div class="m-foot">
      <button class="btn btn-ghost" onclick="closePicker()">Cancel</button>
      <button class="btn btn-fill" onclick="confirmPicker()">Add Selected</button>
    </div>
  </div>
</div>
<div class="overlay" id="ov-recipe" onclick="if(event.target===this)closeRecipeForm()">
  <div class="modal" style="max-height:92vh">
    <div class="m-handle"></div>
    <div class="m-hd"><h3 id="rf-title">New Recipe</h3><button class="m-close" onclick="closeRecipeForm()">&#10005;</button></div>
    <div style="overflow-y:auto;flex:1;padding:16px">
      <div class="fg"><label class="flbl">Recipe Name</label><input class="finp" id="rf-name" type="text" placeholder="e.g. Mango Chicken Bowl"></div>
      <div class="fg"><label class="flbl">Category</label>
        <select class="fsel" id="rf-cat">
          <option value="breakfast">Breakfast</option>
          <option value="lunch">Lunch</option>
          <option value="dinner" selected>Dinner</option>
          <option value="snack">Snack</option>
          <option value="essential">Home Essential</option>
        </select>
      </div>
      <div class="fg"><label class="flbl">Tags</label>
        <div class="ftrow">
          <button class="ftog gft on" id="rf-gf" onclick="this.classList.toggle('on')">Gluten-Free</button>
          <button class="ftog het" id="rf-he" onclick="this.classList.toggle('on')">Home Essential</button>
        </div>
      </div>
      <div class="fg"><label class="flbl">Ingredients</label>
        <div id="ing-list"></div>
        <button class="btn btn-ghost" style="font-size:13px;padding:8px 14px;margin-top:4px" onclick="addIngRow()">+ Add Ingredient</button>
      </div>
      <div class="fg"><label class="flbl">Notes</label>
        <textarea class="finp" id="rf-notes" rows="3" placeholder="Prep tips, substitutions..." style="resize:none"></textarea>
      </div>
    </div>
    <div class="m-foot">
      <button class="btn btn-ghost" onclick="closeRecipeForm()">Cancel</button>
      <button class="btn btn-fill" onclick="saveRecipe()">Save Recipe</button>
    </div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

// ── CONSTANTS
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DAYABB=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MEALS=[{k:'breakfast',l:'Breakfast'},{k:'lunch',l:'Lunch'},{k:'dinner',l:'Dinner'},{k:'snack',l:'Snacks'}];
const CLABEL={breakfast:'Breakfast',lunch:'Lunch',dinner:'Dinner',snack:'Snacks',essential:'Home Essential'};
const GCATS=['produce','proteins','dairy','pantry','frozen','herbs & spices','other'];
// ── STATE
let allRecipes=[...DR];
let weekData={};
let gChecked={};
let nextCustomId=2000;
let weekOffset=0;
let collapsed={};
let pCtx=null,pFilter='all',pTemp=[];
let idxFilter='all',editId=null;
let fbInited=false;
// ── FIREBASE SYNC
function setSS(s){const el=document.getElementById('sync-dot');if(!el)return;el.className='sync-dot '+s;el.title=s==='synced'?'All devices synced':s==='syncing'?'Saving…':'Offline – changes saved locally';}
function initFirebase(){
  setSS('syncing');
  MPR.on('value',snap=>{
    const d=snap.val()||{};
    weekData=d.weekData||{};
    const cust=d.customRecipes?Object.values(d.customRecipes):[];
    allRecipes=[...DR,...cust];
    nextCustomId=d.nextCustomId||2000;
    setSS('synced');
    if(!fbInited){fbInited=true;}
    renderPlanner();
    if(document.getElementById('pg-grocery').classList.contains('on'))renderGrocery();
    if(document.getElementById('pg-index').classList.contains('on'))renderIndex();
  },err=>{
    console.warn('Firebase:',err);
    setSS('offline');
    if(!fbInited){fbInited=true;renderPlanner();}
  });
}
function saveDay(key){
  setSS('syncing');
  MPR.child('weekData/'+key).set(weekData[key]||null)
    .then(()=>setSS('synced')).catch(()=>setSS('offline'));
}
function saveCustom(){
  setSS('syncing');
  const obj={};
  allRecipes.filter(r=>r.custom).forEach(r=>{obj[r.id]=r;});
  MPR.child('customRecipes').set(Object.keys(obj).length?obj:null)
    .catch(()=>setSS('offline'));
  MPR.child('nextCustomId').set(nextCustomId)
    .then(()=>setSS('synced')).catch(()=>setSS('offline'));
}
// ── UTILS
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getR(id){return allRecipes.find(r=>r.id==id);}
let toastT=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2200);
}
function getWeekDates(off){
  const now=new Date();
  const d=new Date(now);
  const dow=d.getDay();
  const diff=dow===0?-6:1-dow;
  d.setDate(d.getDate()+diff+off*7);
  return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x;});
}
function dk(dt){return dt.toISOString().split('T')[0];}
function fmtRange(dates){
  const opts={month:'short',day:'numeric'};
  return dates[0].toLocaleDateString('en-US',opts)+' – '+dates[6].toLocaleDateString('en-US',opts);
}
function ensureDay(key){if(!weekData[key])weekData[key]={breakfast:[],lunch:[],dinner:[],snack:[],notes:''};}
function guessGCat(ing){
  const s=ing.toLowerCase();
  if(/spinach|greens|lettuce|broccoli|pepper|tomato|cucumber|zucchini|avocado|lemon|banana|berry|berries|apple|mango|corn|carrot|onion|garlic|ginger|cilantro|basil|fruit/.test(s))return'produce';
  if(/chicken|beef|turkey|pork|shrimp|salmon|tuna|egg|protein/.test(s))return'proteins';
  if(/yogurt|milk|butter|cheese|parmesan|cheddar|brie|cream|hummus|dairy/.test(s))return'dairy';
  if(/oil|sauce|soy|rice|quinoa|pasta|oat|grain|can|broth|coconut|honey|maple|almond butter|tahini|mayo|mustard|cracker|tortilla|bread/.test(s))return'pantry';
  if(/frozen/.test(s))return'frozen';
  if(/cumin|curry|cinnamon|pepper flake|rosemary|thyme|dill|herb|spice|seasoning|salt/.test(s))return'herbs & spices';
  return'other';
}
// ── PAGE NAV
function showPage(name){
  document.querySelectorAll('.pg').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('on'));
  document.getElementById('pg-'+name).classList.add('on');
  document.getElementById('nav-'+name).classList.add('on');
  if(name==='grocery')renderGrocery();
  if(name==='index')renderIndex();
}
// ── PLANNER
function changeWeek(d){weekOffset+=d;renderPlanner();}
function clearWeek(){
  if(!confirm('Clear all meals for this week?'))return;
  const dates=getWeekDates(weekOffset);
  dates.forEach(dt=>{
    const k=dk(dt);
    weekData[k]={breakfast:[],lunch:[],dinner:[],snack:[],notes:''};
    saveDay(k);
  });
  renderPlanner();toast('Week cleared');
}
function toggleDay(key){
  collapsed[key]=!collapsed[key];
  const dc=document.querySelector('.dc[data-key="'+key+'"]');
  if(dc)dc.classList.toggle('col',!!collapsed[key]);
}
function saveNote(key,val){
  ensureDay(key);weekData[key].notes=val;saveDay(key);
}
function removeR(dayKey,mealKey,id){
  ensureDay(dayKey);
  weekData[dayKey][mealKey]=(weekData[dayKey][mealKey]||[]).filter(x=>x.id!=id);
  saveDay(dayKey);renderPlannerDay(dayKey);
}
function chipHtml(dayKey,mealKey,r){
  const tags=(r.gf?'<span class="chip-gf">GF</span>':'')+( r.he?'<span class="chip-he">HE</span>':'');
  const cls=r.gf&&r.he?'chip gf he':r.gf?'chip gf':r.he?'chip he':'chip';
  return '<span class="'+cls+'">'+esc(r.name)+tags+'<button class="chip-rm" onclick="removeR(\''+dayKey+'\',\''+mealKey+'\','+r.id+')" aria-label="Remove">×</button></span>';
}
function buildDayBody(key,dt){
  ensureDay(key);
  const day=weekData[key];
  let html='<div class="dbody">';
  MEALS.forEach(m=>{
    const items=(day[m.k]||[]).map(x=>{const r=getR(x.id);return r?chipHtml(key,m.k,r):'';}).join('');
    html+='<div class="msec"><div class="msec-hd"><span class="msec-lbl">'+m.l+'</span><button class="msec-add" onclick="openPicker(\''+key+'\',\''+m.k+'\',\''+m.l+'\')">+ Add</button></div>';
    html+='<div class="chips">'+(items||'<span class="empty-slot">Tap + to add</span>')+'</div></div>';
    html+='<div class="msec-div"></div>';
  });
  html+='<textarea class="day-notes" placeholder="Notes for this day…" rows="2" onblur="saveNote(\''+key+'\',this.value)">'+esc(day.notes||'')+'</textarea>';
  html+='</div>';
  return html;
}
function renderPlannerDay(key){
  const dc=document.querySelector('.dc[data-key="'+key+'"]');
  if(!dc)return;
  const old=dc.querySelector('.dbody');
  if(old)old.remove();
  const dates=getWeekDates(weekOffset);
  const dt=dates.find(d=>dk(d)===key);
  if(!dt)return;
  dc.insertAdjacentHTML('beforeend',buildDayBody(key,dt));
}
function renderPlanner(){
  const dates=getWeekDates(weekOffset);
  const todayK=dk(new Date());
  document.getElementById('wlabel').textContent=fmtRange(dates);
  document.getElementById('hweek').textContent='Week of '+dates[0].toLocaleDateString('en-US',{month:'long',day:'numeric'});
  let html='';
  dates.forEach((dt,i)=>{
    const key=dk(dt);
    ensureDay(key);
    const day=weekData[key];
    const isToday=key===todayK;
    const col=collapsed[key]?'col':'';
    const mealCount=MEALS.reduce((a,m)=>a+(day[m.k]||[]).length,0);
    const sumText=mealCount?mealCount+' meal'+(mealCount!==1?'s':''):'No meals planned';
    html+='<div class="dc '+col+(isToday?' today':'')+'" data-key="'+key+'">';
    html+='<div class="dh" onclick="toggleDay(\''+key+'\')">';
    html+='<div class="dh-l"><div class="day-dot"><span class="dd-day">'+DAYABB[i]+'</span><span class="dd-num">'+dt.getDate()+'</span></div>';
    html+='<div><div class="dh-name">'+DAYS[i]+'</div><div class="dh-sub">'+sumText+'</div></div></div>';
    html+='<span class="dchev">&#8250;</span></div>';
    if(!col)html+=buildDayBody(key,dt);
    html+='</div>';
  });
  document.getElementById('days').innerHTML=html;
}
// ── PICKER
function openPicker(dayK,mealK,mealL){
  pCtx={dayK,mealK};
  pFilter='all';
  pTemp=[];
  document.getElementById('picker-title').textContent='Add to '+mealL;
  document.getElementById('picker-q').value='';
  document.querySelectorAll('#ov-picker .fchip').forEach(b=>b.classList.toggle('on',b.dataset.mf==='all'));
  renderPicker();
  document.getElementById('ov-picker').classList.add('on');
  setTimeout(()=>document.getElementById('picker-q').focus(),300);
}
function closePicker(){document.getElementById('ov-picker').classList.remove('on');pCtx=null;pTemp=[];}
function setPF(btn){
  pFilter=btn.dataset.mf;
  document.querySelectorAll('#ov-picker .fchip').forEach(b=>b.classList.toggle('on',b===btn));
  renderPicker();
}
function togglePick(id){
  const idx=pTemp.indexOf(id);
  if(idx>-1)pTemp.splice(idx,1);else pTemp.push(id);
  renderPicker();
}
function renderPicker(){
  const q=(document.getElementById('picker-q').value||'').toLowerCase();
  let list=allRecipes.filter(r=>r.cat!=='essential');
  if(pFilter==='gf')list=list.filter(r=>r.gf);
  else if(pFilter==='he')list=list.filter(r=>r.he);
  else if(pFilter!=='all')list=list.filter(r=>r.cat===pFilter);
  if(q)list=list.filter(r=>r.name.toLowerCase().includes(q)||r.ing.some(x=>x.toLowerCase().includes(q)));
  if(!list.length){document.getElementById('picker-list').innerHTML='<div style="padding:32px;text-align:center;color:var(--mu);font-size:14px">No recipes found</div>';return;}
  const cats=[...new Set(list.map(r=>r.cat))];
  let html='';
  cats.forEach(cat=>{
    html+='<div class="list-cat">'+CLABEL[cat]+'</div>';
    list.filter(r=>r.cat===cat).forEach(r=>{
      const sel=pTemp.includes(r.id);
      const tags=(r.gf?'<span class="rtag rtag-gf">GF</span>':'')+( r.he?'<span class="rtag rtag-he">HE</span>':'')+(r.custom?'<span class="rtag rtag-c">Custom</span>':'');
      html+='<div class="ritem'+(sel?' sel':'')+'" onclick="togglePick('+r.id+')">';
      html+='<div class="rchk">'+(sel?'✓':'')+'</div>';
      html+='<div><div class="rname">'+esc(r.name)+'</div><div class="rcat-lbl">'+CLABEL[r.cat]+'</div></div>';
      html+='<div class="rtags">'+tags+'</div></div>';
    });
  });
  document.getElementById('picker-list').innerHTML=html;
}
function confirmPicker(){
  if(!pCtx||!pTemp.length){closePicker();return;}
  ensureDay(pCtx.dayK);
  const existing=(weekData[pCtx.dayK][pCtx.mealK]||[]).map(x=>x.id);
  pTemp.forEach(id=>{if(!existing.includes(id))weekData[pCtx.dayK][pCtx.mealK].push({id});});
  saveDay(pCtx.dayK);
  renderPlannerDay(pCtx.dayK);
  closePicker();
  toast(pTemp.length+' recipe'+(pTemp.length!==1?'s':'')+' added');
}
// ── RECIPE FORM
function openRecipeForm(id){
  editId=id||null;
  const r=id?getR(id):null;
  document.getElementById('rf-title').textContent=r?'Edit Recipe':'New Recipe';
  document.getElementById('rf-name').value=r?r.name:'';
  document.getElementById('rf-cat').value=r?r.cat:'dinner';
  document.getElementById('rf-gf').classList.toggle('on',r?!!r.gf:true);
  document.getElementById('rf-he').classList.toggle('on',r?!!r.he:false);
  document.getElementById('rf-notes').value=r&&r.notes?r.notes:'';
  const il=document.getElementById('ing-list');
  il.innerHTML='';
  (r?r.ing:['','','']).forEach(v=>addIngRow(v));
  document.getElementById('ov-recipe').classList.add('on');
  setTimeout(()=>document.getElementById('rf-name').focus(),300);
}
function closeRecipeForm(){document.getElementById('ov-recipe').classList.remove('on');editId=null;}
function addIngRow(val){
  const row=document.createElement('div');row.className='ing-row';
  row.innerHTML='<input type="text" placeholder="e.g. 2 cups spinach" value="'+esc(val||'')+'">'
    +'<button class="ing-rm" onclick="this.parentElement.remove()">×</button>';
  document.getElementById('ing-list').appendChild(row);
}
function saveRecipe(){
  const name=document.getElementById('rf-name').value.trim();
  if(!name){toast('Please enter a recipe name');return;}
  const ings=[...document.querySelectorAll('#ing-list input')].map(i=>i.value.trim()).filter(Boolean);
  const rec={
    id:editId||(nextCustomId++),
    name,
    cat:document.getElementById('rf-cat').value,
    gf:document.getElementById('rf-gf').classList.contains('on'),
    he:document.getElementById('rf-he').classList.contains('on'),
    custom:true,
    ing:ings,
    notes:document.getElementById('rf-notes').value.trim()
  };
  if(editId){const i=allRecipes.findIndex(r=>r.id===editId);if(i>-1)allRecipes[i]=rec;}
  else allRecipes.push(rec);
  saveCustom();
  closeRecipeForm();
  renderIndex();
  toast(editId?'Recipe updated':'Recipe saved');
}
function deleteRecipe(id){
  if(!confirm('Delete this recipe?'))return;
  allRecipes=allRecipes.filter(r=>r.id!==id);
  saveCustom();renderIndex();toast('Recipe deleted');
}
// ── GROCERY
function toggleGC(key){gChecked[key]=!gChecked[key];renderGrocery();}
function uncheckAll(){gChecked={};renderGrocery();}
function renderGrocery(){
  const dates=getWeekDates(weekOffset);
  const ingMap={};
  dates.forEach(dt=>{
    const key=dk(dt);
    if(!weekData[key])return;
    MEALS.forEach(m=>{
      (weekData[key][m.k]||[]).forEach(x=>{
        const r=getR(x.id);
        if(!r)return;
        (r.ing||[]).forEach(ing=>{
          const norm=ing.trim().toLowerCase();
          if(!ingMap[norm])ingMap[norm]={name:ing.trim(),sources:[],cat:guessGCat(ing)};
          if(!ingMap[norm].sources.includes(r.name))ingMap[norm].sources.push(r.name);
        });
      });
    });
  });
  const items=Object.values(ingMap);
  if(!items.length){
    document.getElementById('glist').innerHTML='<div class="gempty"><div class="gempty-ico">🛒</div><div>No ingredients yet</div><div style="font-size:12px;margin-top:6px">Add meals to your planner to see the shopping list here.</div></div>';
    return;
  }
  const byCat={};
  items.forEach(i=>{if(!byCat[i.cat])byCat[i.cat]=[];byCat[i.cat].push(i);});
  let html='';
  GCATS.forEach(cat=>{
    if(!byCat[cat])return;
    html+='<div class="gsec"><div class="gsec-hd">'+cat.charAt(0).toUpperCase()+cat.slice(1)+'</div><div class="g-card">';
    byCat[cat].forEach(item=>{
      const key=item.name.toLowerCase();
      const done=gChecked[key];
      html+='<div class="gi'+(done?' done':'')+'" onclick="toggleGC(\''+esc(key)+'\')">';
      html+='<div class="gi-chk">'+(done?'✓':'')+'</div>';
      html+='<div class="gi-name">'+esc(item.name)+'</div>';
      html+='<div class="gi-src">'+item.sources.slice(0,2).map(esc).join(', ')+(item.sources.length>2?' +more':'')+'</div>';
      html+='</div>';
    });
    html+='</div></div>';
  });
  document.getElementById('glist').innerHTML=html;
}

function setIF(btn){
  idxFilter=btn.dataset.if;
  document.querySelectorAll('.fscroll .fchip').forEach(b=>b.classList.toggle('on',b===btn));

function renderIndex(){
  const q=(document.getElementById('isearch').value||'').toLowerCase();
  let list=[...allRecipes];
  if(idxFilter==='gf')list=list.filter(r=>r.gf);
  else if(idxFilter==='he')list=list.filter(r=>r.he);
  else if(idxFilter==='custom')list=list.filter(r=>r.custom);
  else if(idxFilter!=='all')list=list.filter(r=>r.cat===idxFilter);
  if(q)list=list.filter(r=>r.name.toLowerCase().includes(q)||r.ing.some(x=>x.toLowerCase().includes(q)));
  if(!list.length){document.getElementById('igrid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--mu);font-size:14px">No recipes found</div>';return;}
  let html='';
  list.forEach(r=>{
    const tags=(r.gf?'<span class="rtag rtag-gf">GF</span>':'')+( r.he?'<span class="rtag rtag-he">HE</span>':'')+(r.custom?'<span class="rtag rtag-c">My Recipe</span>':'');
    const ingPrev=r.ing.slice(0,3).join(', ')+(r.ing.length>3?' …':'');
    html+='<div class="icard">';
    html+='<div class="icard-name">'+esc(r.name)+'</div>';
    html+='<div class="icard-cat">'+CLABEL[r.cat]+'</div>';
    html+='<div class="icard-ings">'+esc(ingPrev)+'</div>';
    html+='<div class="icard-tags">'+tags+'</div>';
    if(r.custom){
      html+='<div class="icard-btns"><button class="icard-btn" onclick="openRecipeForm('+r.id+')">Edit</button>';
      html+='<button class="icard-btn del" onclick="deleteRecipe('+r.id+')">Delete</button></div>';
    }
    html+='</div>';
  });
  document.getElementById('igrid').innerHTML=html;
}
// ── INIT
window.addEventListener('DOMContentLoaded',()=>{
  renderPlanner();
  initFirebase();
});
</script>
